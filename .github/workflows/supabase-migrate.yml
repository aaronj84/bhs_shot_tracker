# Deploy Supabase migrations
# PROD: encrypted backup first (see backup-prod.yml), then db push.

on:
  push:
    branches: [dev, main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

jobs:
  backup-prod:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backup-prod.yml
    secrets: inherit

  migrate:
    runs-on: ubuntu-latest
    needs: [backup-prod]
    if: |
      always() && !cancelled() && (
        github.ref == 'refs/heads/dev' ||
        needs.backup-prod.result == 'success'
      )
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and push (DEV)
        if: github.ref == 'refs/heads/dev'
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push

      - name: Link and push (PROD)
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
