# Deploy Supabase migrations (up files missing from the target database),
# then every Edge Function under supabase/functions/.
# PROD: encrypted backup first (see backup-prod.yml), then apply pending ups.

on:
  push:
    branches: [dev, main]
    paths:
      - "supabase/migrations/**"
      - "supabase/down/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/migrate.mjs"
      - "scripts/lib/migrate.mjs"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

# Must cover backup-prod.yml's permissions; a called workflow can't exceed its caller.
permissions:
  contents: read
  actions: write

jobs:
  backup-prod:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backup-prod.yml
    secrets: inherit

  migrate:
    runs-on: ubuntu-latest
    needs: [backup-prod]
    if: |
      always() && !cancelled() && (
        github.ref == 'refs/heads/dev' ||
        needs.backup-prod.result == 'success'
      )
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and apply pending (DEV)
        if: github.ref == 'refs/heads/dev'
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          node scripts/migrate.mjs status
          node scripts/migrate.mjs up --yes

      - name: Link and apply pending (PROD)
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          node scripts/migrate.mjs status
          node scripts/migrate.mjs up --yes

  # After migrate so a function never ships ahead of the tables it reads.
  deploy-functions:
    runs-on: ubuntu-latest
    needs: [migrate]
    if: always() && needs.migrate.result == 'success'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_PROJECT_REF_PROD || secrets.SUPABASE_PROJECT_REF_DEV }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        run: |
          test -n "$SUPABASE_PROJECT_ID" || (echo "Missing project ref secret" && exit 1)
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID"
