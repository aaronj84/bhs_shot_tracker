# Deploy static site to GitHub Pages with PROD shots-config.js

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write PROD shots-config.js
        env:
          SHOTS_SUPABASE_URL: ${{ secrets.SHOTS_SUPABASE_URL_PROD }}
          SHOTS_SUPABASE_ANON_KEY: ${{ secrets.SHOTS_SUPABASE_ANON_KEY_PROD }}
          SHOTS_PIN: ${{ secrets.SHOTS_PIN }}
        run: node scripts/write-shots-config.js

      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js shots.js shots-api.js schedule.js shots-config.js .nojekyll _site/
          cp -R assets/* _site/assets/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
