# Refresh long-lived STAGING from an encrypted PROD dump, deploy edge
# functions, assemble + optionally publish the staging frontend.
#
# Manual: Actions → Refresh STAGING → Run workflow
# Schedule: weekly (Sunday 06:00 UTC) when secrets exist
#
# Never writes to PROD. See docs/pr-preview.md.

name: Refresh STAGING

on:
  workflow_dispatch:
    inputs:
      dump_source:
        description: "Where to get the PROD dump"
        type: choice
        options:
          - from-latest-artifact
          - dump-prod-first
        default: from-latest-artifact
      skip_functions:
        description: "Skip edge function deploy"
        type: boolean
        default: false
      skip_site:
        description: "Skip staging site assemble/publish"
        type: boolean
        default: false
  schedule:
    # Weekly refresh so reviewers see recent PROD-shaped data
    - cron: "0 6 * * 0"

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
      SUPABASE_DB_PASSWORD_PROD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      SUPABASE_PROJECT_REF_STAGING: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
      SUPABASE_DB_PASSWORD_STAGING: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
      SUPABASE_DB_URL_STAGING: ${{ secrets.SUPABASE_DB_URL_STAGING }}
      SHOTS_SUPABASE_URL_STAGING: ${{ secrets.SHOTS_SUPABASE_URL_STAGING }}
      SHOTS_SUPABASE_ANON_KEY_STAGING: ${{ secrets.SHOTS_SUPABASE_ANON_KEY_STAGING }}
      SHOTS_PIN: ${{ secrets.SHOTS_PIN }}
      SHOTS_BRAND_SUB: Staging
      SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
      SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      STAGING_SURGE_DOMAIN: ${{ vars.STAGING_SURGE_DOMAIN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Require STAGING secrets
        run: |
          if [[ -z "${SUPABASE_PROJECT_REF_STAGING:-}" && -z "${SUPABASE_DB_URL_STAGING:-}" ]]; then
            echo "Missing SUPABASE_PROJECT_REF_STAGING (or SUPABASE_DB_URL_STAGING)."
            echo "See docs/pr-preview.md human checklist."
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_URL_STAGING:-}" && -z "${SUPABASE_DB_PASSWORD_STAGING:-}" ]]; then
            echo "Missing SUPABASE_DB_PASSWORD_STAGING (or SUPABASE_DB_URL_STAGING)."
            exit 1
          fi
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)

      - name: Refresh STAGING from PROD dump
        id: refresh
        run: |
          set -euo pipefail
          ARGS=()
          SOURCE="${{ github.event.inputs.dump_source || 'from-latest-artifact' }}"
          if [[ "$SOURCE" == "dump-prod-first" ]]; then
            ARGS+=(--dump-prod-first)
          else
            ARGS+=(--from-latest-artifact)
          fi
          if [[ "${{ github.event.inputs.skip_functions || 'false' }}" == "true" ]]; then
            ARGS+=(--skip-functions)
          fi
          if [[ "${{ github.event.inputs.skip_site || 'false' }}" == "true" ]]; then
            ARGS+=(--skip-site)
          fi
          ./scripts/staging-refresh.sh "${ARGS[@]}"

      - name: Publish staging site (surge if configured)
        if: ${{ github.event.inputs.skip_site != 'true' }}
        id: publish
        run: ./scripts/publish-staging-site.sh --dir _staging_site

      - name: Upload staging site artifact
        if: ${{ github.event.inputs.skip_site != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-site-${{ github.run_id }}
          path: _staging_site/
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          DOMAIN="${STAGING_SURGE_DOMAIN:-bhs-shot-tracker-staging.surge.sh}"
          {
            echo "## STAGING refresh"
            echo ""
            echo "- Project ref: \`${SUPABASE_PROJECT_REF_STAGING:-from DB URL}\`"
            if [[ -n "${SURGE_TOKEN:-}" ]]; then
              echo "- Frontend: https://${DOMAIN}"
            else
              echo "- Frontend: Actions artifact \`staging-site-${{ github.run_id }}\` (set SURGE_LOGIN + SURGE_TOKEN for a live URL)"
            fi
            echo "- Docs: \`docs/pr-preview.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
