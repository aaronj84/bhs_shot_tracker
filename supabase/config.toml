# Link + migrate: see docs/dev-environment.md and supabase/README.md
#   supabase link --project-ref <ref>
#   npm run db:up
# Deploy Explore (optional):
#   supabase secrets set OPENAI_API_KEY=sk-...
#   supabase functions deploy explore-shots
# Opponent Prep Gemini (optional):
#   supabase secrets set GEMINI_API_KEY=...
#   supabase functions deploy prep-opponent

project_id = "bhs_shot_tracker"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.explore-shots]
verify_jwt = true

[functions.prep-opponent]
verify_jwt = true
