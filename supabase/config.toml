# Link + migrate: see docs/dev-environment.md and supabase/README.md
#   supabase link --project-ref <ref>
#   npm run db:up
# Edge Functions deploy from CI (.github/workflows/supabase-migrate.yml) on
# push to dev (DEV) / main (PROD). Secrets are set once per project:
#   supabase secrets set OPENAI_API_KEY=sk-...   # explore-shots
#   supabase secrets set GEMINI_API_KEY=...      # prep-opponent
#   supabase secrets set MP_REFRESH_GITHUB_TOKEN=...  # mp-refresh (Actions r/w PAT)

project_id = "bhs_shot_tracker"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.explore-shots]
verify_jwt = true

[functions.prep-opponent]
verify_jwt = true

[functions.maxpreps-rankings]
verify_jwt = true

[functions.mp-whatif]
verify_jwt = true

[functions.mp-refresh]
verify_jwt = true
