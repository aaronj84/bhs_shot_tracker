# Link + migrate: see docs/dev-environment.md and supabase/README.md
#   supabase link --project-ref <ref>
#   npm run db:up
# Edge Functions deploy from CI (.github/workflows/supabase-migrate.yml) on
# push to dev (DEV) / main (PROD). Secrets are set once per project:
#   supabase secrets set OPENAI_API_KEY=sk-...   # explore-shots
#   supabase secrets set GEMINI_API_KEY=...      # prep-opponent
#   supabase secrets set MP_REFRESH_GITHUB_TOKEN=...  # mp-refresh (Actions r/w PAT)
#   schedule-worker (all optional; missing ones are skipped):
#   supabase secrets set TWILIO_ACCOUNT_SID=AC... TWILIO_AUTH_TOKEN=... TWILIO_FROM_NUMBER=+1...
#   supabase secrets set GOOGLE_CALENDAR_ID=...@group.calendar.google.com
#   supabase secrets set GOOGLE_SERVICE_ACCOUNT_JSON="$(cat service-account.json)"

project_id = "bhs_shot_tracker"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.explore-shots]
verify_jwt = true

[functions.prep-opponent]
verify_jwt = true

[functions.maxpreps-rankings]
verify_jwt = true

[functions.mp-whatif]
verify_jwt = true

[functions.mp-refresh]
verify_jwt = true

# Called by pg_cron (no JWT) and the public booking page. Idempotent claims.
[functions.schedule-worker]
verify_jwt = false

# Calendar apps can't send a JWT; the URL's feed token is the credential.
[functions.schedule-ics]
verify_jwt = false
